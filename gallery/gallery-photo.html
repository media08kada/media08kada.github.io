<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Icon Font -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <!-- Materialize CSS -->
    <link type="text/css" rel="stylesheet" href="../css/materialize.min.css" media="screen,projection" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/photo.css">
    <link rel="stylesheet" href="../css/darkmode.css">
    
    <title>Gallery Photo</title>

  </head>
  <body id="home" class="scrollspy">

     <!-- Navbar Start -->
      <nav class="navbar" data-aos="fade-down" data-aos-duration="1000">
      <div class="container nav-wrapper-custom">
          <a class="navbar-brand" href="#"> <img src="/img/partner/MediaKelapadua.png"/></a>

          <!-- Switch di kiri khusus mobile -->
          <li class="dark-mode-item">
            <div class="switch small">
              <label>
                <i class="material-icons">wb_sunny</i>
                <input type="checkbox" id="darkmodetoggle">
              </label>
            </div>
          </li>
      
          <a href="../index.html" data-target="mobile-nav" class="sidenav-trigger right">
            <i class="material-icons large">home</i>
          </a>
          <ul class="right hide-on-med-and-down">
            <li><a href="../index.html">Beranda</a></li>
            <li>
         </div>
        <!-- Garis Bar Navbar --> 
        <div class="progress">
       <div class="indeterminate"></div>
      </div>
    </nav>
</div>

    <!-- Info Event -->
    <section id="gallery-photo" class="gallery-photo" style="margin-top: 100px;">
  <div class="container">
    <h4 class="center light grey-text light">Gallery-Photo</h4>
          
    <div class="container">
      <img src="../img/gallery/1.jpg" class="preview-img" id="preview-img" alt="Gambar-1" />

      <div class="galleries">
        <img src="../img/gallery/1.jpg" onclick="imgPreview(this.src)" alt="" />
        <img src="../img/gallery/2.jpg" onclick="imgPreview(this.src)" alt="" />
        <img src="../img/gallery/3.jpg" onclick="imgPreview(this.src)" alt="" />
        <img src="../img/gallery/4.jpg" onclick="imgPreview(this.src)" alt="" />
        <img src="../img/gallery/5.jpg" onclick="imgPreview(this.src)" alt="" />
        <img src="../img/gallery/6.jpg" onclick="imgPreview(this.src)" alt="" />
        <img src="../img/gallery/7.jpg" onclick="imgPreview(this.src)" alt="" />
        <img src="../img/gallery/8.jpg" onclick="imgPreview(this.src)" alt="" />
        <img src="../img/gallery/9.jpg" onclick="imgPreview(this.src)" alt="" />
      </div>
    </div>
    <script>
      const imgPreview = (src) => {
        document.getElementById('preview-img').src = src;
      };
    </script>
            <!-- Gallery end -->

    <!-- JavaScript -->
    <script type="text/javascript" src="../js/materialize.min.js"></script>
    <script src="../js/darkmode.js"></script>
    
  </body>
